name: Release Helm chart
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-beyla-helm-chart:
    uses: grafana/helm-charts/.github/workflows/update-helm-repo.yaml@51b0862988d8724eb961e17cb25d1add5241a8b3
    permissions:
      contents: "write"
      id-token: "write"
      packages: "write"
    with:
      github_app: grafana-beyla-bot
      charts_dir: charts/beyla
      cr_configfile: .github/configs/cr.yml
      ct_configfile: .github/configs/ct.yml
